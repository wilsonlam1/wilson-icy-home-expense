<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WILSON-ICY HOME EXPENSE</title>
<meta name="theme-color" content="#F5F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Expense">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --paper:#F5F1E8; --card:#FFFDF8; --field:#F9F6EF; --ink:#1E2320; --muted:#5E655F; --line:#E3DDD0; --line2:#EEE8DC;
  --soft:#ECE6D8; --accent:#2E6A4E; --accent-ink:#1F4C37; --accent-soft:#E3EEE7; --up:#B4472A; --down:#2E6A4E;
  --dark:#1E2320; --dark2:#2C332F; --on-dark:#F5F1E8; --on-dark-muted:#C9C4B8; --fixedbar:#D9D1BF;
  --serif:"Noto Serif TC",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:var(--accent)}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.brand{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.field{height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);width:100%}
textarea.field{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid #D6CFBF;background:var(--card);font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.danger{color:var(--up);border-color:#E2B9AB}
.btn.small{height:36px;font-size:14px;padding:0 12px}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6CFBF;background:var(--card);font-size:14px}
.dot{width:8px;height:8px;border-radius:4px;flex-shrink:0;display:inline-block}
.up{color:var(--up)} .down{color:var(--down)}
h2{margin:0;font-size:16px}

/* layout */
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(76px + var(--safe-b))}
.view{display:none;padding:0 16px 16px}
.view.on{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:none;border:0;padding:6px 0;min-height:32px}
.sync .dot{background:#B9B09C}
.sync.ok .dot{background:var(--accent)} .sync.ok{color:var(--accent)}
.sync.busy .dot{background:#C08A2E}
.sync.err .dot{background:var(--up)} .sync.err{color:var(--up)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:var(--safe-b);z-index:10}
nav.tabs button{height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px}

/* entry */
.e-head{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 4px 12px}
.e-date{font-family:var(--serif);font-size:26px;font-weight:700}
.amt-card{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.amt-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.amt{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.1;word-break:break-all;text-align:right}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:32px;padding:0 12px;border-radius:8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:12px 0 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:12px}
.cat{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;padding:0 4px;background:var(--card);border:1px solid var(--line)}
.cat[aria-pressed="true"]{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent-ink);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:12px}
.key{height:52px;border-radius:14px;font-size:22px;font-family:var(--serif);border:1px solid var(--line);background:var(--card)}
.key.op{background:var(--soft)}
.key.on{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.key.save{font-family:inherit;font-size:17px;font-weight:700;border:0;background:var(--accent);color:#fff}
.key:active{transform:scale(.97)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border:0;border-top:1px solid var(--line2);background:none;text-align:left;width:100%;font-size:14px}
.row .grow{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.row .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:var(--muted)}
.row .amtx{font-family:var(--serif);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}

/* stats */
.m-head{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.circle{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.circle:disabled{opacity:.35;cursor:default}
.hero{background:var(--dark);color:var(--on-dark);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .big{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
.hero .box{background:var(--dark2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.hero .lbl{font-size:12px;color:var(--on-dark-muted)}
.hero .up{color:#F0A58A} .hero .down{color:#8FD1AE}
.pill{height:32px;padding:0 12px;border-radius:16px;font-size:12px;background:transparent;color:var(--on-dark);border:1px solid #5E655F}
.pill[aria-pressed="true"]{background:var(--on-dark);color:var(--ink);font-weight:700;border-color:var(--on-dark)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--serif);font-size:17px;font-weight:700}
.tile .s{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{margin-top:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
.trend{display:grid;gap:10px;align-items:end;height:150px}
.trend button{border:0;background:none;padding:0;height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:3px}
.trend .v{font-size:10px;color:var(--muted);text-align:center}
.trend .b1{border-radius:5px 5px 0 0}
.trend .b2{background:var(--fixedbar);border-radius:0 0 3px 3px}
.trend .m{font-size:12px;color:var(--muted);text-align:center;padding-top:4px}
.trend button[aria-current="true"] .m{color:var(--ink);font-weight:700}

/* list */
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 0 4px}
.empty{padding:24px 0;text-align:center;color:var(--muted);font-size:14px}

/* settings */
.form{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px 12px;align-items:center;font-size:14px}
.fx{display:grid;grid-template-columns:minmax(0,1fr) 88px 58px 28px 28px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.fx input.field{height:38px;padding:0 8px;font-size:15px}
.fx input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.x{border:0;background:none;font-size:18px;color:var(--muted);width:28px;height:38px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(30,35,32,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:var(--dark);color:var(--on-dark);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
.toast.on{opacity:1}

/* desktop */
@media (min-width:1024px){
  .app{max-width:1440px;padding:0 32px 32px;display:grid;grid-template-columns:360px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:24px}
  .topbar{grid-column:1/3;padding:24px 0 16px}
  .topbar .brand{font-family:var(--serif);font-size:26px;letter-spacing:.04em;color:var(--ink)}
  nav.tabs{position:static;grid-column:2;grid-row:2;display:flex;gap:4px;background:none;border:0;padding:0 0 12px}
  nav.tabs button{height:40px;flex-direction:row;padding:0 16px;border-radius:10px;font-size:15px;gap:8px}
  nav.tabs button[aria-current="page"]{background:var(--card);border:1px solid var(--line)}
  nav.tabs button[data-tab="entry"]{display:none}
  nav.tabs svg{width:18px;height:18px}
  #v-entry{display:block;grid-column:1;grid-row:2/4;padding:0;position:sticky;top:16px;align-self:start}
  .view{grid-column:2;grid-row:3;padding:0}
  .modal{align-items:center}
  .sheet{border-radius:20px}
  .toast{bottom:32px}
  .desk-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .desk-2 > .sec{margin-top:12px}
  .hero-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:stretch}
  .hero-row .g3{grid-template-columns:1fr;gap:8px}
  .kbd-hint{display:block!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">WILSON-ICY HOME EXPENSE</div>
    <button class="sync" id="syncBtn" type="button" aria-label="同步狀態，撳一下立即同步"><span class="dot"></span><span id="syncTxt">未設定同步</span></button>
  </div>

  <nav class="tabs" aria-label="主選單" id="tabs">
    <button type="button" data-tab="entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>記帳</button>
    <button type="button" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>
    <button type="button" data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>記錄</button>
    <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M3 20v-5h5M21 4v5h-5"/></svg>設定</button>
  </nav>

  <section class="view" id="v-entry" aria-label="記帳"></section>
  <section class="view" id="v-stats" aria-label="分析"></section>
  <section class="view" id="v-list" aria-label="記錄"></section>
  <section class="view" id="v-settings" aria-label="設定"></section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= constants ================= */
const LS_DB = 'wihe.db.v1', LS_GH = 'wihe.gh.v1', LS_UI = 'wihe.ui.v1';
const COLORS = {'食品/飲品':'#2E6A4E','家品':'#B7812A','日用品':'#3B6EA5','交通':'#7A5AA6','娛樂':'#C4577A','保健品':'#3F8F89','旅行':'#CC6F2A','其他':'#7D827B',
  '供樓':'#4A5A52','管理費':'#8A7A5A','水電煤':'#3B6EA5','差餉':'#9A6A4A','上網/訂閱':'#C4577A','維修費':'#7A5AA6','其他固定':'#7D827B',
  'BO':'#3B6EA5','BB':'#C4577A','傢私':'#8A6A3A','電器':'#3F8F89','裝修':'#9A6A4A','傢俬材料/工具':'#B7812A'};
const PALETTE = ['#2E6A4E','#B7812A','#3B6EA5','#7A5AA6','#C4577A','#3F8F89','#CC6F2A','#7D827B'];
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const DEFAULT_SETTINGS = {
  updatedAt: 0,
  rmbRate: 1.09,
  cats: ['食品/飲品','家品','日用品','交通','娛樂','保健品','旅行','其他'],
  fixedCats: ['供樓','管理費','水電煤','差餉','上網/訂閱','維修費','其他固定'],
  quick: ['買餸','菜','肉','水果','雞蛋','麵包','咖啡豆','Aeon','外出食飯'],
  depQuick: ['銀行回贈','旅行FUND','利息'],
  furnCats: ['傢私','電器'],
  renoCats: ['裝修','傢俬材料/工具'],
  fixed: [
    {id:'mortgage', name:'供樓', amount:20665, day:25, cat:'供樓', on:true, start:'2026-10'},
    {id:'mgmt', name:'管理費', amount:1261, day:7, cat:'管理費', on:true, start:'2026-10'},
    {id:'repair', name:'維修費', amount:321, day:21, cat:'維修費', on:true, start:'2026-10'},
    {id:'broadband', name:'中移動寬頻', amount:108, day:31, cat:'上網/訂閱', on:true, start:'2026-10'},
    {id:'netflix', name:'Netflix', amount:98, day:31, cat:'上網/訂閱', on:true, start:'2026-10'}
  ]
};

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const thisYm = () => today().slice(0,7);
const addYm = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); };
const daysIn = ym => { const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const ymLabel = ym => ym.slice(0,4)+'年'+Number(ym.slice(5))+'月';
const mLabel = ym => Number(ym.slice(5))+'月';
const money = (n, dec=0) => (n < 0 ? '-$' : '$') + Math.abs(dec ? Math.round(n*10**dec)/10**dec : Math.round(n)).toLocaleString('en-US', {maximumFractionDigits: dec});
const money1 = n => money(n, 1);
const r2 = n => Math.round(n*100)/100;
const uid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const color = c => COLORS[c] || PALETTE[[...String(c)].reduce((a,ch)=>a+ch.charCodeAt(0),0) % PALETTE.length];
function evalExpr(s){ if(!s) return 0; return String(s).split('+').reduce((t,p)=>{ const v = parseFloat(p); return isNaN(v) ? t : t+v; }, 0); }
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast('本機儲存失敗：'+e.message); return false; } }
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 2200); }
const isDesktop = () => matchMedia('(min-width:1024px)').matches;

/* ================= data ================= */
let DB = lsGet(LS_DB, null) || { records: [], notes: {}, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), dirty: false, lastSync: 0 };
DB.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), DB.settings || {});
DB.notes = DB.notes || {};
let GH = lsGet(LS_GH, { owner:'', repo:'', path:'expenses.json', branch:'main', token:'' });
const set = () => DB.settings;

function persist(markDirty=true){ if(markDirty) DB.dirty = true; lsSet(LS_DB, DB); if(markDirty) scheduleSync(); }
const live = () => DB.records.filter(r => !r.deleted);
function upsert(rec){ rec.updatedAt = Date.now(); const i = DB.records.findIndex(r => r.id === rec.id); if(i >= 0) DB.records[i] = rec; else DB.records.push(rec); }
function touchSettings(){ set().updatedAt = Date.now(); }

/* auto-post fixed templates: deterministic id => no duplicates across devices */
function postFixed(){
  const now = today(), cur = thisYm(); let added = 0;
  const ids = new Set(DB.records.map(r => r.id));
  for(const t of set().fixed){
    if(!t.on || !t.amount) continue;
    for(let ym = t.start || cur; ym <= cur; ym = addYm(ym, 1)){
      const day = Math.min(Number(t.day) || 1, daysIn(ym)), date = ym+'-'+pad(day);
      const id = 'fx-'+t.id+'-'+ym;
      if(date > now || ids.has(id)) continue;
      DB.records.push({ id, date, item: t.name+' ('+mLabel(ym)+')', amount: Number(t.amount), cat: t.cat || '其他固定', type:'fixed', auto:true, updatedAt: Date.now() });
      ids.add(id); added++;
    }
  }
  if(added){ persist(); }
  return added;
}

/* ================= merge + GitHub sync ================= */
function mergeInto(remote){
  if(!remote) return;
  const map = new Map(DB.records.map(r => [r.id, r]));
  for(const r of (remote.records || [])){ const l = map.get(r.id); if(!l || (r.updatedAt||0) > (l.updatedAt||0)) map.set(r.id, r); }
  DB.records = [...map.values()];
  for(const [k, v] of Object.entries(remote.notes || {})){ const l = DB.notes[k]; if(!l || (v.updatedAt||0) > (l.updatedAt||0)) DB.notes[k] = v; }
  if(remote.settings && (remote.settings.updatedAt||0) > (set().updatedAt||0)) DB.settings = Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), remote.settings);
}
function fingerprint(d){
  if(!d) return '';
  const rs = (d.records||[]).map(r => r.id+':'+(r.updatedAt||0)).sort().join(',');
  const ns = Object.entries(d.notes||{}).map(([k,v]) => k+':'+(v.updatedAt||0)).sort().join(',');
  return rs+'|'+ns+'|'+((d.settings && d.settings.updatedAt)||0);
}
function serialize(){
  const recs = [...DB.records].sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1));
  return '{"app":"wilson-icy-home-expense","version":1,"savedAt":'+JSON.stringify(new Date().toISOString())+
    ',\n"settings":'+JSON.stringify(DB.settings)+',\n"notes":'+JSON.stringify(DB.notes)+
    ',\n"records":[\n'+recs.map(r => JSON.stringify(r)).join(',\n')+'\n]}\n';
}
function b64enc(str){ const b = new TextEncoder().encode(str); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
function b64dec(b64){ const s = atob(b64.replace(/\s/g,'')); const b = new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i); return new TextDecoder().decode(b); }
const ghReady = () => GH.owner && GH.repo && GH.token && GH.path;
function ghUrl(p){ return 'https://api.github.com/repos/'+encodeURIComponent(GH.owner.trim())+'/'+encodeURIComponent(GH.repo.trim())+p; }
function ghHeaders(){ return { 'Authorization':'Bearer '+GH.token.trim(), 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }
function ghErr(status, body){
  if(status === 401) return 'Token 無效或已過期';
  if(status === 403) return 'Token 冇權限（要 Contents: Read and write）';
  if(status === 404) return '搵唔到 repo，檢查帳號名/repo 名/Token 權限';
  return 'GitHub 錯誤 '+status+(body && body.message ? '：'+body.message : '');
}
async function ghGet(){
  const path = GH.path.trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  const res = await fetch(ghUrl('/contents/'+path+'?ref='+encodeURIComponent(GH.branch||'main')), { headers: ghHeaders(), cache:'no-store' });
  if(res.status === 404){
    const repo = await fetch(ghUrl(''), { headers: ghHeaders(), cache:'no-store' });
    if(!repo.ok) throw new Error(ghErr(repo.status));
    return { data:null, sha:null };
  }
  if(!res.ok) throw new Error(ghErr(res.status, await res.json().catch(()=>null)));
  const j = await res.json();
  let text;
  if(j.content) text = b64dec(j.content);
  else { const b = await fetch(ghUrl('/git/blobs/'+j.sha), { headers: ghHeaders(), cache:'no-store' }); if(!b.ok) throw new Error(ghErr(b.status)); text = b64dec((await b.json()).content); }
  return { data: JSON.parse(text), sha: j.sha };
}
async function ghPut(sha){
  const path = GH.path.trim().replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  const body = { message: 'update '+new Date().toISOString().slice(0,16).replace('T',' '), content: b64enc(serialize()), branch: GH.branch || 'main' };
  if(sha) body.sha = sha;
  const res = await fetch(ghUrl('/contents/'+path), { method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body) });
  if(res.status === 409 || res.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if(!res.ok) throw new Error(ghErr(res.status, await res.json().catch(()=>null)));
}
let syncing = false, syncAgain = false, syncTimer = null, syncError = '';
function scheduleSync(ms=2000){ if(!ghReady()) { renderSync(); return; } clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); renderSync(); }
async function sync(manual){
  if(!ghReady()){ if(manual) { toast('請先喺「設定」填 GitHub 資料'); go('settings'); } return; }
  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ syncError = '離線中，有網絡會自動同步'; renderSync(); return; }
  syncing = true; syncError = ''; renderSync();
  try{
    for(let attempt = 0; attempt < 4; attempt++){
      const { data, sha } = await ghGet();
      const before = fingerprint(data);
      mergeInto(data);
      postFixed();
      if(before === fingerprint(DB)) break;          // remote already up to date
      try { await ghPut(sha); break; }
      catch(e){ if(!e.conflict || attempt === 3) throw e; }  // someone else wrote meanwhile → re-fetch & merge
    }
    DB.dirty = false; DB.lastSync = Date.now(); lsSet(LS_DB, DB);
    if(manual) toast('同步完成');
  } catch(e){ syncError = e.message || String(e); if(manual) toast(syncError); }
  syncing = false; renderAll();
  if(syncAgain){ syncAgain = false; scheduleSync(500); }
}
function renderSync(){
  const b = $('#syncBtn'), t = $('#syncTxt'); b.className = 'sync';
  if(!ghReady()){ t.textContent = '未設定同步'; return; }
  if(syncing){ b.classList.add('busy'); t.textContent = '同步中…'; return; }
  if(syncError){ b.classList.add('err'); t.textContent = syncError.length > 18 ? '同步失敗' : syncError; b.title = syncError; return; }
  if(DB.dirty){ b.classList.add('busy'); t.textContent = '有未上傳記錄'; return; }
  b.classList.add('ok'); t.textContent = DB.lastSync ? '已同步 '+ago(DB.lastSync) : '已同步';
}

const PEOPLE = [['BO','Wilson (BO)'],['BB','Icy (BB)'],['其他','其他']];
const ACCTS = ['銀行戶口','現金POOL'];
const TYPES = { daily:'日常開支', fixed:'固定/帳單', deposit:'存入', furniture:'傢私+電器', reno:'裝修工程' };
const personName = c => (PEOPLE.find(p => p[0] === c) || [c, c])[1];
function catsFor(type){
  const s = set();
  if(type === 'fixed') return s.fixedCats;
  if(type === 'deposit') return PEOPLE.map(p => p[0]);
  if(type === 'furniture') return s.furnCats;
  if(type === 'reno') return s.renoCats;
  return s.cats;
}
const catLabel = (type, c) => type === 'deposit' ? personName(c) : c;
const isExpense = r => r.type !== 'deposit';
function agg(ym, exTravel){
  const a = { daily:0, fixed:0, cats:{}, fcats:{}, n:0, max:null, fixedRecs:[], any:false, dep:0, depBy:{}, depAcct:{}, depRecs:[] };
  for(const r of DB.records){
    if(r.deleted || r.date.slice(0,7) !== ym) continue;
    if(r.type === 'deposit'){ a.dep += r.amount; a.depBy[r.cat] = (a.depBy[r.cat]||0) + r.amount; const ac = r.acct || '銀行戶口'; a.depAcct[ac] = (a.depAcct[ac]||0) + r.amount; a.depRecs.push(r); continue; }
    if(r.type === 'furniture' || r.type === 'reno') continue;   // one-off projects: kept out of monthly analysis
    a.any = true;
    if(r.type === 'fixed'){ a.fixed += r.amount; a.fcats[r.cat] = (a.fcats[r.cat]||0) + r.amount; a.fixedRecs.push(r); continue; }
    if(exTravel && r.cat === '旅行') continue;
    a.daily += r.amount; a.cats[r.cat] = (a.cats[r.cat]||0) + r.amount; a.n++;
    if(!a.max || r.amount > a.max.amount) a.max = r;
  }
  a.total = a.daily + a.fixed;
  return a;
}
function depTotals(){
  const t = { all:0, by:{}, acct:{}, year:0, yearBy:{} }, y = thisYm().slice(0,4);
  for(const r of DB.records){
    if(r.deleted || r.type !== 'deposit') continue;
    t.all += r.amount; t.by[r.cat] = (t.by[r.cat]||0) + r.amount;
    const ac = r.acct || '銀行戶口'; t.acct[ac] = (t.acct[ac]||0) + r.amount;
    if(r.date.slice(0,4) === y){ t.year += r.amount; t.yearBy[r.cat] = (t.yearBy[r.cat]||0) + r.amount; }
  }
  return t;
}
function firstYm(){ let m = thisYm(); for(const r of DB.records) if(!r.deleted && (r.type === 'daily' || r.type === 'fixed' || r.type === 'deposit') && r.date.slice(0,7) < m) m = r.date.slice(0,7); return m; }
function delta(cur, prev, pct=true){
  if(prev == null) return '<span class="muted">—</span>';
  const d = cur - prev; if(Math.abs(d) < 0.5) return '<span class="muted">持平</span>';
  const p = prev ? ' ('+(d>0?'+':'')+(Math.round(d/prev*1000)/10)+'%)' : '';
  return '<span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+money(Math.abs(d))+(pct?p:'')+'</span>';
}

function keyPress(k){
  let e = E.expr; E.saved = false;
  if(k === 'C') E.expr = '';
  else if(k === 'del') E.expr = e.slice(0,-1);
  else if(k === 'rmb') E.rmb = !E.rmb;
  else if(k === '+'){ if(e && !e.endsWith('+')) E.expr = e + '+'; }
  else if(k === 'save') return saveEntry();
  else {
    if(e.length > 40) return;
    const seg = e.split('+').pop();
    if(k === '.' && seg.includes('.')) return;
    if(k === '.' && seg === '') k = '0.';
    if(seg.includes('.') && seg.split('.')[1].length >= 2 && k !== '.') return;
    E.expr = e + k;
  }
  renderEntry();
}
function saveEntry(){

  if(!(total > 0)) { toast('請輸入金額'); return; }
  const rate = Number(set().rmbRate) || 1.09, dep = E.type === 'deposit';
  let item = (E.item||'').trim();

  const rec = { id: uid(), date: E.date, item, amount: r2(E.rmb ? total*rate : total), cat: E.cat, type: E.type };
  if(dep) rec.acct = E.acct;
  if(E.rmb) rec.rmb = r2(total);
  if(E.expr.includes('+')) rec.calc = E.expr;
  upsert(rec); persist();
  E.expr = ''; E.item = ''; E.rmb = false; E.saved = true;
  if(E.type === 'daily') E.cat = set().cats[0];
  renderAll();
  toast((dep ? '已記低存入 ' : '已儲存 ')+money1(rec.amount)+' · '+(dep ? personName(rec.cat) : rec.item));
}

/* ================= edit modal ================= */
let editArm = false, editNew = null;
function catOptions(type, selected){
  const list = catsFor(type), all = list.includes(selected) || !selected ? list : [selected, ...list];
  return all.map(c => `<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(catLabel(type, c))}</option>`).join('');
}
function openEdit(id, newType){
  let r;
  if(newType){ editNew = { id: uid(), date: today(), item:'', amount:0, cat: catsFor(newType)[0], type: newType }; r = editNew; }
  else { editNew = null; r = DB.records.find(x => x.id === id); if(!r) return; }
  editArm = false;
  const s = set();
  $('#sheet').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="editTitle" style="font-size:18px">${newType ? '新增'+TYPES[newType] : '修改記錄'}</h2><button type="button" class="x" id="mClose" aria-label="關閉">×</button></div>
    <div class="form">
      <label for="mDate">日期</label><input id="mDate" type="date" class="field" value="${esc(r.date)}">
      <label for="mType">類型</label><select id="mType" class="field">${Object.entries(TYPES).map(([k,l]) => `<option value="${k}" ${k===(r.type||'daily')?'selected':''}>${l}</option>`).join('')}</select>
      <label for="mCat" id="mCatL">${r.type === 'deposit' ? '存入人' : '類別'}</label><select id="mCat" class="field">${catOptions(r.type, r.cat)}</select>
      <label for="mAcct" class="acctRow" ${r.type==='deposit'?'':'hidden'}>存入去</label><select id="mAcct" class="field acctRow" ${r.type==='deposit'?'':'hidden'}>${ACCTS.map(a => `<option ${a===(r.acct||'銀行戶口')?'selected':''}>${a}</option>`).join('')}</select>
      <label for="mItem">項目</label><input id="mItem" class="field" value="${esc(r.item)}">
      <label for="mAmt">港元</label><input id="mAmt" class="field num" inputmode="decimal" value="${esc(r.calc || (r.amount || ''))}" style="font-size:18px">
      <label for="mRmb">人民幣</label><input id="mRmb" class="field" inputmode="decimal" value="${esc(r.rmb ?? '')}" placeholder="選填：填咗會自動 × ${esc(s.rmbRate)}">
      <label for="mNoteR">備註</label><input id="mNoteR" class="field" value="${esc(r.note||'')}">
    </div>
    <div style="display:flex;gap:8px">${newType ? '' : '<button type="button" class="btn danger" id="mDel">刪除</button>'}<div style="flex-grow:1"></div><button type="button" class="btn" id="mCancel">取消</button><button type="button" class="btn primary" id="mSave">儲存</button></div>`;
  $('#modal').classList.add('on'); $('#modal').dataset.id = r.id;
  const rmb = $('#mRmb'); rmb.addEventListener('input', () => { const v = evalExpr(rmb.value); if(v > 0) $('#mAmt').value = r2(v*(Number(s.rmbRate)||1.09)); });
  $('#mType').addEventListener('change', () => {
    const t = $('#mType').value; $('#mCat').innerHTML = catOptions(t, null);
    $('#mCatL').textContent = t === 'deposit' ? '存入人' : '類別';
    document.querySelectorAll('.acctRow').forEach(el => el.hidden = t !== 'deposit');
  });
  setTimeout(() => $(newType ? '#mItem' : '#mItem').focus(), 50);
}
function closeEdit(){ $('#modal').classList.remove('on'); editNew = null; }
function saveEdit(){
  const id = $('#modal').dataset.id, r = editNew || DB.records.find(x => x.id === id); if(!r) return closeEdit();
  const amtStr = $('#mAmt').value.trim(), amt = evalExpr(amtStr);
  const type = $('#mType').value;
  if(!(amt > 0) && !(type === 'furniture' || type === 'reno')) return toast('金額唔啱');
  const n = Object.assign({}, r, { date: $('#mDate').value || r.date, item: $('#mItem').value.trim() || $('#mCat').value, amount: r2(amt), type, cat: $('#mCat').value });
  if(type === 'deposit') n.acct = $('#mAcct').value; else delete n.acct;
  if(amtStr.includes('+')) n.calc = amtStr; else delete n.calc;
  const rv = evalExpr($('#mRmb').value); if(rv > 0) n.rmb = r2(rv); else delete n.rmb;
  const nt = $('#mNoteR').value.trim(); if(nt) n.note = nt; else delete n.note;
  const wasNew = !!editNew;
  upsert(n); persist(); closeEdit(); renderAll(); toast(wasNew ? '已新增' : '已更新');
}
function deleteEdit(){
  if(!editArm){ editArm = true; $('#mDel').textContent = '再撳一次確認刪除'; return; }
  const id = $('#modal').dataset.id, r = DB.records.find(x => x.id === id);
  if(r){ upsert({ id: r.id, date: r.date, item: r.item, amount: r.amount, cat: r.cat, type: r.type, deleted: true }); persist(); }
  closeEdit(); renderAll(); toast('已刪除');
}

/* ================= export / import ================= */
function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function rowsFor(type){
  return live().filter(r => r.type === type).sort((a,b) => a.date < b.date ? -1 : 1).map(r => type === 'deposit'
    ? ({ '日期': r.date, '項目': r.item, '金額': r.amount, '存入人': personName(r.cat), '存入去': r.acct || '銀行戶口', 'NOTE': r.note || '' })
    : ({ '日期': r.date, '項目': r.item, '港元': r.amount, '人民幣': r.rmb ?? '', '類別': r.cat, 'NOTE': r.note || '' }));
}
function summaryRows(){
  const out = []; for(let m = firstYm(); m <= thisYm(); m = addYm(m,1)){ const a = agg(m); if(!a.any && !a.dep) continue;
    const dc = m === thisYm() ? Number(today().slice(8)) : daysIn(m);
    out.push({ 'Month': m, '日常開支': r2(a.daily), '固定開支': r2(a.fixed), '總開支': r2(a.total), 'Avg / day': r2(a.total/dc),
      '存入 BO': r2(a.depBy.BO||0), '存入 BB': r2(a.depBy.BB||0), '存入 其他': r2(a.depBy['其他']||0), '存入合計': r2(a.dep), '結餘': r2(a.dep - a.total), 'NOTE': (DB.notes[m]&&DB.notes[m].text)||'' }); }
  return out;
}
function exportCsv(){
  const rows = live().sort((a,b) => a.date < b.date ? -1 : 1);
  const q = v => '"'+String(v ?? '').replace(/"/g,'""')+'"';
  const csv = '﻿日期,項目,港元,人民幣,類別/存入人,類型,存入去,NOTE\n' + rows.map(r => [r.date, r.item, r.amount, r.rmb ?? '', catLabel(r.type, r.cat), TYPES[r.type] || r.type, r.acct || '', r.note||''].map(q).join(',')).join('\n');
  download('home-expense-'+today()+'.csv', new Blob([csv], { type:'text/csv;charset=utf-8' }));
}
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('載入失敗')); document.head.appendChild(s); }); }
async function exportXlsx(){
  try{
    if(!window.XLSX){ toast('準備 Excel…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    const wb = XLSX.utils.book_new();
    const add = (name, rows, widths) => { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
    add('日常開支', rowsFor('daily'), [12,40,10,10,12,20]);
    add('固定開支', rowsFor('fixed'), [12,24,10,10,12,20]);
    add('存入', rowsFor('deposit'), [12,24,12,14,12,20]);
    add('每月總結', summaryRows(), [10,12,12,12,10,10,10,10,12,12,40]);
    add('傢私+電器', rowsFor('furniture'), [12,50,10,10,10,24]);
    add('裝修工程', rowsFor('reno'), [12,40,10,10,14,30]);
    XLSX.writeFile(wb, 'Home-Expense-'+today()+'.xlsx');
  } catch(e){ toast('匯出 Excel 失敗，可以用 CSV'); }
}
async function importJson(file){
  try{
    const data = JSON.parse(await file.text());
    const remote = Array.isArray(data) ? { records: data } : data;
    if(!Array.isArray(remote.records)) throw new Error('格式唔啱');
    const before = live().length;
    mergeInto(remote); postFixed(); persist(); renderAll();
    toast('匯入完成：新增 '+(live().length - before)+' 筆');
  } catch(e){ toast('匯入失敗：'+e.message); }
}

/* ================= render all + events ================= */
function renderAll(){
  const tab = (isDesktop() && UI.tab === 'entry') ? 'stats' : UI.tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  ['entry','stats','list','settings'].forEach(t => $('#v-'+t).classList.toggle('on', t === tab));
  renderEntry();
  if(tab === 'stats') renderStats();
  if(tab === 'list') renderList();
  if(tab === 'settings') renderSettings();
  renderSync();
}
function saveSettingsFromForm(){
  const s = set(), list = v => v.split(/[,，、]/).map(x => x.trim()).filter(Boolean);
  const c = list($('#sCats').value), fc = list($('#sFCats').value), q = list($('#sQuick').value), rate = parseFloat($('#sRate').value);
  if(c.length) s.cats = c; if(fc.length) s.fixedCats = fc; s.quick = q; if(rate > 0) s.rmbRate = rate;
  s.depQuick = list($('#sDQuick').value); const fu = list($('#sFurn').value), re = list($('#sReno').value); if(fu.length) s.furnCats = fu; if(re.length) s.renoCats = re;
  touchSettings(); persist();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset;
  if(d.tab){ go(d.tab); return; }
  if(t.id === 'syncBtn'){ sync(true); return; }
  if(d.key){ keyPress(d.key); return; }
  if(d.cat){ E.cat = d.cat; renderEntry(); return; }
  if(d.type){ E.type = d.type; E.cat = catsFor(d.type)[0]; E.saved = false; renderEntry(); return; }
  if(d.acct){ E.acct = d.acct; renderEntry(); return; }
  if(d.dquick){ E.item = d.dquick; E.cat = '其他'; E.type = 'deposit'; renderEntry(); return; }
  if(d.new){ openEdit(null, d.new); return; }
  if(d.quick){ E.item = E.item ? E.item + '、' + d.quick : d.quick; E.cat = set().cats[0]; E.type = 'daily'; renderEntry(); return; }
  if(d.edit){ openEdit(d.edit); return; }
  if(d.ym){ UI.statsYm = addYm(UI.statsYm, Number(d.ym)); renderStats(); return; }
  if(d.goym){ UI.statsYm = d.goym; renderStats(); return; }
  if(t.id === 'exTravel'){ UI.exTravel = !UI.exTravel; saveUI(); renderStats(); return; }
  if(d.lym){ UI.listYm = addYm(UI.listYm, Number(d.lym)); renderList(); return; }
  if(d.lt){ UI.listType = d.lt; renderList(); return; }
  if(t.id === 'mClose' || t.id === 'mCancel'){ closeEdit(); return; }
  if(t.id === 'mSave'){ saveEdit(); return; }
  if(t.id === 'mDel'){ deleteEdit(); return; }
  if(t.id === 'gSave'){
    GH = { owner: $('#gOwner').value.trim(), repo: $('#gRepo').value.trim(), path: $('#gPath').value.trim() || 'expenses.json', branch: $('#gBranch').value.trim() || 'main', token: $('#gToken').value.trim() };
    lsSet(LS_GH, GH); syncError = ''; sync(true); return;
  }
  if(t.id === 'gSync'){ sync(true); return; }
  if(t.id === 'fxAdd'){ set().fixed.push({ id: uid(), name:'新固定開支', amount:0, day:1, cat:'其他固定', on:true, start: thisYm() }); touchSettings(); persist(); renderSettings(); return; }
  if(d.fxdel != null){ set().fixed.splice(Number(d.fxdel), 1); touchSettings(); persist(); renderSettings(); return; }
  if(t.id === 'dImport'){ $('#dFile').click(); return; }
  if(t.id === 'dJson'){ download('home-expense-backup-'+today()+'.json', new Blob([serialize()], { type:'application/json' })); return; }
  if(t.id === 'dCsv'){ exportCsv(); return; }
  if(t.id === 'dXlsx'){ exportXlsx(); return; }
  if(t.id === 'dWipe'){
    if(t.dataset.arm !== '1'){ t.dataset.arm = '1'; t.textContent = '再撳一次：清除本機（GitHub 上嘅數據唔會刪）'; return; }
    DB = { records: [], notes: {}, settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), dirty:false, lastSync:0 }; lsSet(LS_DB, DB); renderAll(); toast('已清除本機資料'); return;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'eItem') E.item = t.value;
  if(t.id === 'lq'){ UI.q = t.value; const pos = t.selectionStart; renderList(); const n = $('#lq'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'eDate'){ E.date = t.value || today(); renderEntry(); }
  if(t.id === 'mNote'){ const ym = UI.statsYm, v = t.value.trim(); DB.notes[ym] = { text: v, updatedAt: Date.now() }; persist(); toast('備註已儲存'); }
  if(t.dataset && t.dataset.fx != null){
    const f = set().fixed[Number(t.dataset.fx)], k = t.dataset.f;
    if(k === 'on') f.on = t.checked; else if(k === 'amount') f.amount = parseFloat(t.value) || 0; else if(k === 'day') f.day = Math.min(31, Math.max(1, parseInt(t.value) || 1)); else f[k] = t.value.trim();
    touchSettings(); persist(); postFixed(); renderSettings();
  }
  if(['sCats','sFCats','sQuick','sRate','sDQuick','sFurn','sReno'].includes(t.id)){ saveSettingsFromForm(); }
  if(t.id === 'dFile' && t.files[0]){ importJson(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => {
  const modal = $('#modal').classList.contains('on');
  if(modal){ if(e.key === 'Escape') closeEdit(); if(e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); saveEdit(); } return; }
  const tag = e.target.tagName;
  if(e.target.id === 'eItem' && e.key === 'Enter'){ e.preventDefault(); if(E.expr) saveEntry(); else e.target.blur(); return; }
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const entryVisible = isDesktop() || UI.tab === 'entry'; if(!entryVisible) return;
  let k = null;
  if(/^[0-9]$/.test(e.key)) k = e.key; else if(e.key === '.') k = '.'; else if(e.key === '+') k = '+';
  else if(e.key === 'Backspace') k = 'del'; else if(e.key === 'Escape') k = 'C'; else if(e.key === 'Enter') k = 'save';
  if(k){ e.preventDefault(); keyPress(k); }
});
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeEdit(); });
let lastW = innerWidth; addEventListener('resize', () => { if((lastW >= 1024) !== (innerWidth >= 1024)) renderAll(); lastW = innerWidth; });
addEventListener('online', () => scheduleSync(300));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ if(E.date < today() && !E.expr) E.date = today(); postFixed(); renderAll(); scheduleSync(300); } });
setInterval(renderSync, 60000);

/* ================= boot ================= */
postFixed();
renderAll();
if(ghReady()) scheduleSync(300);
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
